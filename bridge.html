<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Bridge</title></head>
<body><script>
/* Hands Tish's old app data to admin.tishxkitchen.com, and only to it. */
(function(){
  var TO = "https://admin.tishxkitchen.com", d = {};
  try{ d.v2 = localStorage.getItem("tishskitchen.v2"); d.v1 = localStorage.getItem("tishskitchen.v1"); }catch(e){}
  if (window.parent !== window) window.parent.postMessage({ tkBridge:1, data:d }, TO);
})();
</script></body></html>
